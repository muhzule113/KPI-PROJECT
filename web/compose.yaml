services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kpi_management
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: kpi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kpi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kpi_postgres_data:
