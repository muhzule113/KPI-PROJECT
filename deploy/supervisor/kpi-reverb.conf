[program:kpi-reverb]
command=/usr/bin/php /var/www/kpi-project/backend/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/kpi-project/backend
user=www-data
numprocs=1
process_name=%(program_name)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kpi-reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
