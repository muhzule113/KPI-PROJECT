name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kpi_management_test
          POSTGRES_USER: kpi
          POSTGRES_PASSWORD: kpi
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U kpi -d kpi_management_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://kpi:kpi@127.0.0.1:5432/kpi_management_test?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      SEED_ADMIN_NAME: Administrator KPI
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: CI-only-password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run check
